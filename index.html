<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domain Test Page</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Arial, Helvetica, sans-serif;
      background: #f1f5f9; color: #0f172a;
    }
    main {
      width: min(100%, 620px); padding: 36px; text-align: center;
      background: #fff; border: 1px solid #dbe3ec; border-radius: 18px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, .08);
    }
    .status {
      display: inline-block; padding: 7px 12px; border-radius: 999px;
      background: #dcfce7; color: #166534; font-size: 13px; font-weight: 700;
    }
    h1 { margin: 18px 0 10px; font-size: clamp(26px, 5vw, 36px); }
    p { line-height: 1.6; color: #475569; }
    code { padding: 3px 7px; background: #f1f5f9; border-radius: 6px; }
    footer { margin-top: 26px; font-size: 12px; color: #64748b; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #e2e8f0; }
      main { background: #1e293b; border-color: #334155; }
      p { color: #cbd5e1; }
      code { background: #334155; color: #e2e8f0; }
      footer { color: #94a3b8; }
    }
  </style>
</head>
<body>
  <main>
    <span class="status">✓ DOMAIN TEST SUCCESSFUL</span>
    <h1>Domain is Working!</h1>
    <p>If you can see this page, the domain is resolving and the web server is serving the <code>index.html</code> file.</p>
    <p>Replace this test page with your website files when you're ready.</p>
    <footer>Temporary domain test page</footer>
  </main>
</body>
</html>
