# Push to main -> live server updates itself over FTP.
# GitHub installs the PHP packages (vendor/), uploads only the files that changed, then calls
# https://<site>/deploy-hook so the server runs migrate + erp:install + fresh caches.
# Repository secrets (GitHub -> Settings -> Secrets and variables -> Actions):
#   FTP_SERVER      FTP host, e.g. ftp.your-domain.com
#   FTP_USERNAME    FTP account user, e.g. deploy@your-domain.com
#   FTP_PASSWORD    FTP account password
#   FTP_SERVER_DIR  optional, folder of the site as the FTP account sees it, ending in / (default ./)
#   SITE_URL        optional, e.g. https://erp.your-domain.com (needed for the deploy hook)
#   DEPLOY_TOKEN    optional, same value as ERP_DEPLOY_TOKEN in the server's .env (needed for the deploy hook)
name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
      HAS_HOOK: ${{ secrets.SITE_URL != '' && secrets.DEPLOY_TOKEN != '' }}
    steps:
      - name: Secrets missing
        if: env.HAS_FTP != 'true'
        run: echo "::warning::FTP_SERVER / FTP_USERNAME / FTP_PASSWORD are not set - deploy skipped."

      - uses: actions/checkout@v4
        if: env.HAS_FTP == 'true'

      - name: PHP 8.3
        if: env.HAS_FTP == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, zip, bcmath, curl, pdo_mysql
          tools: composer:v2

      - name: Install PHP packages (vendor/)
        if: env.HAS_FTP == 'true'
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Upload changed files over FTP
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          timeout: 600000
          # .env, uploads, logs and backups on the server are never touched: only files from this repo are sent
          exclude: |
            **/.git/**
            .github/**
            node_modules/**
            tests/**
            legacy/**
            docs/**
            .env
            .phpunit.result.cache
            phpunit.xml
            start-erp.bat

      - name: Run migrations and refresh caches on the server
        if: env.HAS_FTP == 'true' && env.HAS_HOOK == 'true'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST "${SITE_URL%/}/deploy-hook" -H "X-Deploy-Token: $DEPLOY_TOKEN" -H "Accept: application/json" --max-time 300
