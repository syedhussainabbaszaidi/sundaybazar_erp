# Push to main -> live server updates itself over FTP.
# GitHub installs the PHP packages (vendor/), uploads only the files that changed, then calls
# https://<site>/deploy-hook so the server runs migrate + erp:install + fresh caches.
# Repository secrets (GitHub -> Settings -> Secrets and variables -> Actions):
#   FTP_SERVER      FTP host, e.g. ftp.your-domain.com
#   FTP_USERNAME    FTP account user, e.g. deploy@your-domain.com
#   FTP_PASSWORD    FTP account password
#   FTP_SERVER_DIR  optional, folder of the site as the FTP account sees it, ending in / (default ./)
#   SITE_URL        optional, e.g. https://erp.your-domain.com (needed for the deploy hook)
#   DEPLOY_TOKEN    optional, same value as ERP_DEPLOY_TOKEN in the server's .env (needed for the deploy hook)
name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
      HAS_HOOK: ${{ secrets.SITE_URL != '' && secrets.DEPLOY_TOKEN != '' }}
    steps:
      - name: Secrets missing
        if: env.HAS_FTP != 'true'
        env:
          S: ${{ secrets.FTP_SERVER != '' }}
          U: ${{ secrets.FTP_USERNAME != '' }}
          P: ${{ secrets.FTP_PASSWORD != '' }}
        run: |
          echo "FTP_SERVER set: $S | FTP_USERNAME set: $U | FTP_PASSWORD set: $P"
          echo "::warning::Missing repository secret(s) - deploy skipped. FTP_SERVER=$S FTP_USERNAME=$U FTP_PASSWORD=$P (Settings > Secrets and variables > Actions > Repository secrets)"

      - uses: actions/checkout@v4
        if: env.HAS_FTP == 'true'

      - name: PHP 8.3
        if: env.HAS_FTP == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, zip, bcmath, curl, pdo_mysql
          tools: composer:v2

      - name: Install PHP packages (vendor/)
        if: env.HAS_FTP == 'true'
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Stamp the commit (checked by the Health check workflow)
        if: env.HAS_FTP == 'true'
        run: echo "$GITHUB_SHA" > public/version.txt

      # erp.sundaybazar.com.pk serves the project folder itself, so the public/ files also go to the root
      # (works the same if the document root is ever switched to public/)
      - name: Copy public files to the project root
        if: env.HAS_FTP == 'true'
        run: |
          cp -a public/erp .
          cp -a public/*.png public/*.ico public/robots.txt public/site.webmanifest public/version.txt .
          sed "s#__DIR__.'/../#__DIR__.'/#g" public/index.php > index.php
          grep -q "__DIR__.'/vendor/autoload.php'" index.php

      - name: Upload changed files over FTP
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          timeout: 600000
          # .env, uploads, logs and backups on the server are never touched: only files from this repo are sent
          exclude: |
            **/.git/**
            .github/**
            node_modules/**
            tests/**
            legacy/**
            docs/**
            .env
            .phpunit.result.cache
            phpunit.xml
            start-erp.bat

      # A folder created by cPanel Git Version Control is 0700: the web server cannot read it and every URL is 404.
      - name: Fix permissions (folders 755, web files 644)
        if: env.HAS_FTP == 'true'
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || './' }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow no; set cmd:fail-exit no;
            cd '$FTP_SERVER_DIR';
            chmod 755 . erp erp/fonts public public/erp public/erp/fonts storage bootstrap bootstrap/cache vendor app config database resources routes;
            chmod 644 index.php .htaccess robots.txt version.txt favicon.ico favicon-32.png apple-touch-icon.png icon-192.png icon-512.png sundaybazarlogo.png site.webmanifest;
            chmod 644 erp/app.js erp/app.css erp/auth.js erp/auth.css erp/pre.js erp/post.js erp/shopify.js erp/access.js;
            chmod 644 public/index.php public/.htaccess vendor/autoload.php;
            ls -la;
            bye"

      - name: Run migrations and refresh caches on the server
        if: env.HAS_FTP == 'true' && env.HAS_HOOK == 'true'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST "${SITE_URL%/}/deploy-hook" -H "X-Deploy-Token: $DEPLOY_TOKEN" -H "Accept: application/json" --max-time 300
